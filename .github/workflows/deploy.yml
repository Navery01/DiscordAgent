name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from GitHub UI

concurrency:
  group: deploy
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  # ── 1. Build & push image to GitHub Container Registry ──────────────────────
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # tag with the short commit SHA (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-
            # always update :latest on main
            type=raw,value=latest,enable=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to homelab via self-hosted runner ──────────────────────────────
  #
  # SETUP: Install the GitHub Actions runner on your homelab server and give it
  # the label "homelab" so this job targets it.
  #
  # Quick install (run on your homelab):
  #   mkdir -p ~/actions-runner && cd ~/actions-runner
  #   curl -o actions-runner-linux-x64.tar.gz -L \
  #     https://github.com/actions/runner/releases/latest/download/actions-runner-linux-x64-<version>.tar.gz
  #   tar xzf ./actions-runner-linux-x64.tar.gz
  #   ./config.sh --url https://github.com/<owner>/<repo> --token <REGISTRATION_TOKEN> --labels homelab
  #   sudo ./svc.sh install && sudo ./svc.sh start
  #
  # Required GitHub secrets (Settings → Secrets and variables → Actions):
  #   DISCORD_TOKEN       — your Discord bot token
  #   ANTHROPIC_API_KEY   — your Anthropic API key
  #   DATABASE_URL        — Postgres connection string
  #   BNET_CLIENT_ID / BNET_CLIENT_SECRET — Battle.net OAuth client
  #   PUBLIC_BASE_URL     — public tunnel URL, e.g. https://link.yourguild.com
  #
  # The runner needs Docker + Docker Compose installed and the runner user added
  # to the docker group:
  #   sudo usermod -aG docker $USER
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to homelab
    environment: DiscordAgent-CD
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write .env
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          LINK_SERVER_HOST: 0.0.0.0
        run: |
          umask 077
          printf '%s=%s\n' \
            DISCORD_TOKEN "$DISCORD_TOKEN" \
            ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
            DATABASE_URL "$DATABASE_URL" \
            BNET_CLIENT_ID "$BNET_CLIENT_ID" \
            BNET_CLIENT_SECRET "$BNET_CLIENT_SECRET" \
            PUBLIC_BASE_URL "$PUBLIC_BASE_URL" \
            LINK_SERVER_HOST "$LINK_SERVER_HOST" > .env

      - name: Pull latest image
        run: docker compose pull

      - name: Restart bot
        run: docker compose up -d --remove-orphans

      - name: Clean up old images
        run: docker image prune -f

      - name: Verify container is running
        run: |
          sleep 5
          docker compose ps
          # Fail the job if the bot container exited immediately
          STATUS=$(docker compose ps --status exited -q)
          if [ -n "$STATUS" ]; then
            echo "Container exited unexpectedly:"
            docker compose logs --tail=50
            exit 1
          fi
