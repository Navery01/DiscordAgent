[project]
name = "discordagent"
version = "0.1.0"
description = "A Discord bot with an AI agent that sets up professional server structures"
readme = "README.md"
authors = [
    { name = "NVAvery", email = "nvavery@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3.0",
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.0",
    "discord>=2.3.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
]

[project.scripts]
discordagent = "discordagent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "discordagent"
module-root = "src"

[tool.uv.workspace]
members = [
    ".",
    ".",
]

[tool.uv.sources]
discordagent = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "discordagent",
]
